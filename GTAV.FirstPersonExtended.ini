; GTAV.FirstPersonExtended: opções. Coloque este arquivo ao lado do GTA5_Enhanced.exe.
; Sem este arquivo, ou com valores inválidos, valem os padrões abaixo.
; Mudanças só valem na próxima vez que o jogo abrir.
[FirstPersonExtended]

; Máximo do slider de FOV de primeira pessoa, em graus HORIZONTAIS (inteiro de 60 a 140).
; O mínimo do slider continua sendo o do jogo. Padrão: 120.
MaxFov=120

; 1 = W+A / W+D mantêm a disparada em primeira pessoa (com som de passos).
; 0 = comportamento original do jogo (a disparada vira corrida). Padrão: 1.
DiagonalSprint=1

; 1 = a mira sem olhar pela mira e o ADS (com ou sem olhar pela mira da arma) usam exatamente
;     o FOV do slider (no máximo, MaxFov), em vez de seguirem a proporção do FOV original de cada
;     uma. Celular e veículos continuam proporcionais; lunetas de sniper continuam nativas.
; 0 = todas as câmeras mantêm o seu FOV e só são ampliadas na mesma proporção do slider. Padrão: 0.
UniversalFov=0
