; GTAV.FirstPersonExtended: opções. Coloque este arquivo ao lado do GTA5_Enhanced.exe (ou do GTA5.exe no Legacy).
; Sem este arquivo, ou com valores inválidos, valem os padrões abaixo.
; Mudanças só valem na próxima vez que o jogo abrir.
[FirstPersonExtended]

; Máximo do slider de FOV de primeira pessoa, em graus HORIZONTAIS (inteiro de 60 a 140).
; O mínimo do slider continua sendo o do jogo. Padrão: 120.
MaxFov=120

; 1 = W+A / W+D mantêm a disparada em primeira pessoa (com som de passos).
; 0 = comportamento original do jogo (a disparada vira corrida). Padrão: 1.
DiagonalSprint=1

; 1 = a mira sem olhar pela mira e o ADS (com ou sem olhar pela mira da arma) usam exatamente
;     o FOV do slider (no máximo, MaxFov), em vez de seguirem a proporção do FOV original de cada
;     uma. Celular e veículos continuam proporcionais; lunetas de sniper continuam nativas.
;     Ao olhar pela mira da arma, o corpo e a arma usam o FOV original do jogo (como PlayerFov,
;     só nessa câmera), para a arma não encolher e as miras continuarem alinhadas.
; 0 = todas as câmeras mantêm o seu FOV e só são ampliadas na mesma proporção do slider. Padrão: 1.
UniversalFov=1

; 1 = em primeira pessoa, o corpo do personagem e a arma nas mãos são desenhados com o FOV que a
;     mesma câmera tinha no jogo original (braços e arma do tamanho de antes), enquanto o mundo usa
;     o FOV do slider. Não vale dentro de veículos (as mãos ficam no volante/guidão). A sombra do
;     personagem e a da arma não acompanham o tamanho maior (efeito conhecido). Experimental.
; 0 = o personagem e a arma usam o mesmo FOV do mundo (exceto ao olhar pela mira com
;     UniversalFov=1, veja acima). Padrão: 0.
PlayerFov=0
