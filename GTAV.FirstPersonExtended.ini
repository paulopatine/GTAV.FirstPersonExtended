; GTAV.FirstPersonExtended: options. Put this file next to GTA5_Enhanced.exe (or GTA5.exe on Legacy).
; Without this file, or with invalid values, the defaults below apply.
; Changes only take effect the next time the game starts.
[FirstPersonExtended]

; Top of the first-person FOV slider, in HORIZONTAL degrees (whole number from 60 to 140).
; The slider minimum stays the game's own. Default: 120.
MaxFov=120

; 1 = W+A / W+D keep sprinting in first person (with footstep sounds).
; 0 = original game behavior (the sprint drops to a run). Default: 1.
DiagonalSprint=1

; 1 = hip aim and ADS (with or without looking through the weapon's sight) use exactly the
;     slider's FOV (at most MaxFov), instead of following the proportion of each camera's own
;     original FOV. The phone and vehicles stay proportional; sniper scopes stay native.
;     While looking through the weapon's sight, the body and the weapon use the game's original
;     FOV (like PlayerFov, for that camera only), so the weapon does not shrink and the sights
;     stay aligned. While reloading, the weapon leaves the sight and uses the world's FOV until
;     it is back at the sight.
; 0 = every camera keeps its own FOV and is only widened in the same proportion as the slider.
; Default: 1.
UniversalFov=1

; 1 = in first person, the character's body and the weapon in the hands are drawn with the FOV
;     the same camera had in the original game (arms and weapon at their original size), while
;     the world uses the slider's FOV. Not applied inside vehicles (the hands stay on the
;     wheel/handlebars). The character's and the weapon's shadows do not follow the larger size,
;     and muzzle effects do not line up with the weapon (known effects). Experimental.
; 0 = the character and the weapon use the same FOV as the world (except while looking through
;     the sight with UniversalFov=1, see above). Default: 0.
PlayerFov=0
